[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["smb2_gym", "smb2_gym.*"]

[tool.setuptools.package-data]
smb2_gym = ["_nes/**/*"]

[project]
name = "smb2-gym"
version = "0.3.0"
authors = [{ name = "Alexei Quick" }]
description = "Super Mario Bros 2 (Europe) Gymnasium Environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "setuptools<67.3.0",
    "gymnasium>=0.29.0",
    "numpy>=1.21.0",
    "pygame>=2.1.0",
    "tetanes-py==0.1.9",
]

[project.urls]
"Homepage" = "https://github.com/alexeiquickcode/smb2-gym"
"Bug Tracker" = "https://github.com/alexeiquickcode/smb2-gym/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright", "pre-commit"]

[project.scripts]
smb2-play = "smb2_gym.play_human:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "smb2_gym/_nes",
    "build",
]

[tool.ruff.format]
quote-style = "preserve"  # the codebase mixes both deliberately; don't churn it

[tool.ruff.lint]
select = [
    "F",    # pyflakes: real errors - undefined names, unused imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort: import ordering
    "UP",   # pyupgrade: modern syntax for the 3.10+ floor
    "B",    # bugbear: likely bugs, e.g. mutable defaults
    "C4",   # comprehensions
    "SIM",  # simplifiable constructs
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length: the RAM tables are hand-aligned, see below
    "B008",    # function call in default arg: fine for our config dataclasses
    "SIM108",  # ternary-instead-of-if: often less readable than the if/else
    # `obs, reward, terminated, truncated, info = env.step(...)` is the Gymnasium
    # API; you cannot decline to unpack the parts you don't need.
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
# The RAM/enemy-slot tables are aligned by hand into columns for readability;
# leave their formatting and star-imports alone.
"smb2_gym/constants/ram.py" = ["E241", "E501"]
"smb2_gym/constants/__init__.py" = ["F403", "F405"]
"smb2_gym/__init__.py" = ["F401", "F403"]
"smb2_gym/app/__init__.py" = ["F401"]
"tests/*" = ["F841"]  # assigned-but-unused is common in test scaffolding

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["smb2_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
