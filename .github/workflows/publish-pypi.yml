name: Publish Python Package

on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - main

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  # A version can only be uploaded to PyPI once, so a broken release cannot be
  # replaced - only yanked and superseded. Everything is verified before upload.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Lint and format
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Run full test suite
        run: uv run pytest -q

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distribution metadata
      run: python -m twine check dist/*

    - name: Publish to Test PyPI
      if: github.ref == 'refs/heads/staging'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      run: |
        python -m twine upload --repository testpypi dist/*

    - name: Publish to PyPI
      if: github.ref == 'refs/heads/main'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/*
