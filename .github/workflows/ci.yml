name: CI

on:
  push:
    branches: [main, staging, updates]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pygame opens a real window otherwise; CI runners have no display.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Run pre-commit
        # Covers ruff check + ruff format + the hygiene hooks, so CI enforces
        # exactly what the local hooks do rather than a drifting subset.
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Run tests
        # The slow markers drive the emulator for thousands of frames; they run
        # in the dedicated job below rather than across the whole matrix.
        run: uv run pytest -m "not slow" -q

  test-slow:
    name: Slow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Run slow tests
        run: uv run pytest -m "slow" -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - name: Confirm the ROM and save states are in the wheel
        # These are package data; a packaging slip ships a wheel that imports
        # fine and then fails at reset() with a missing ROM.
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          roms = [n for n in names if n.endswith('.nes')]
          saves = [n for n in names if n.endswith('.sav')]
          print(f"{wheel}: {len(roms)} rom(s), {len(saves)} save state(s)")
          if not roms or not saves:
              sys.exit("packaged wheel is missing the ROM or save states")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
